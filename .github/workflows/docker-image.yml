name: Build and Push Docker Image

# Lance le workflow lors d'un push ou d'une pull request vers la branche main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Variables reutilisees pour definir le registre et le nom de l'image Docker.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Execute les etapes de construction sur une machine virtuelle Ubuntu.
  build:
    runs-on: ubuntu-latest

    permissions:
      # Autorise la lecture du code source et la publication dans GHCR.
      contents: read
      packages: write
    
    steps:
      # Recupere le contenu du depot afin que Docker puisse construire l'image.
      - name: Checkout repository
        uses: actions/checkout@v3

      # Authentifie GitHub Actions aupres de GitHub Container Registry.
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
        # Construit l'image depuis le Dockerfile, puis la publie avec deux tags.
        # Le tag latest pointe vers la derniere version et le tag SHA identifie
        # precisement le commit a l'origine de l'image.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}